<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Нужные вещи</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="images/logo.png" alt="Логотип Нужные вещи">
      <span>Нужные вещи</span>
    </div>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">О компании</a></li>
        <li><a href="contacts.html">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contacts-info">
      <h1>Свяжитесь с нами</h1>
      <ul>
        <li>Телефон: <a href="tel:+79991234567">+7 (999) 123-45-67</a></li>
        <li>Email: <a href="mailto:info@nuzhnye-veshi.ru">info@nuzhnye-veshi.ru</a></li>
        <li>Адрес: г. Москва, ул. Примерная, д. 1</li>
      </ul>
    </section>

    <section class="feedback">
      <h2>Напишите нам</h2>
      <form class="feedback-form" action="#" method="post">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit" class="btn-submit">Отправить</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <form class="subscribe-form" action="#" method="post">
      <input type="email" placeholder="Ваш Email" required>
      <button type="submit">Подписаться</button>
    </form>
    <p>© 2026 Нужные вещи. Все права защищены. <a href="#">Наверх</a></p>
  </footer>
</body>
</html>
